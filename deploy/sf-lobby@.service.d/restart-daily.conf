# Drop-in for sf-lobby@.service (COMP, CASUAL, REPLAY): backstop restart before
# the ~24 h native crash (notes/CRASH_INVESTIGATION.md) and the idle memory
# growth. The normal path is sf-lobby-idle-restart.timer, which restarts a lobby
# after 20 h only while it's empty; this fires only if it never was.
# Install at: /etc/systemd/system/sf-lobby@.service.d/restart-daily.conf
# RuntimeMaxSec ends with a clean stop, so Restart=always (on-failure wouldn't restart).
[Service]
RuntimeMaxSec=84600
RuntimeRandomizedExtraSec=600
Restart=always
